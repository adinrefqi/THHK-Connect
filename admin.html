<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - THHK Connect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #0f172a; color: white; min-height: 100vh; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .tab-btn.active { background: #3b82f6; color: white; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }
        
        /* Hide scrollbars */
        .scrollbar-none::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-none {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Styles untuk Leger */
        .leger-container { 
            overflow-x: auto; 
            background: rgba(30, 41, 59, 0.45); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px; 
            color: #f1f5f9;
        }
        table { border-collapse: collapse; width: 100%; font-size: 12px; }
        th, td { border: 1px solid rgba(255, 255, 255, 0.06); padding: 8px 6px; text-align: center; }
        th { background: rgba(15, 23, 42, 0.75); color: #94a3b8; font-weight: 600; }
        .sticky-col { position: sticky; left: 0; background: rgba(15, 23, 42, 0.95); z-index: 10; border-right: 2px solid rgba(255, 255, 255, 0.15); min-width: 140px; text-align: left; padding-left: 8px; }

        /* Leger status styles for screen and print */
        .st-H { color: #34d399 !important; } /* emerald-400 */
        .st-T { color: #fb923c !important; } /* orange-400 */
        .st-S { color: #facc15 !important; } /* yellow-400 */
        .st-I { color: #60a5fa !important; } /* blue-400 */
        .st-A { color: #f87171 !important; } /* red-400 */
        .leger-total-col { background: rgba(255, 255, 255, 0.05) !important; color: #818cf8 !important; font-weight: bold; }
        
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; padding: 0 !important; }
            .glass-card { background: none !important; border: none !important; backdrop-filter: none !important; color: black !important; }
            .leger-container { 
                border-radius: 0 !important; 
                box-shadow: none !important; 
                background: white !important; 
                color: black !important; 
                border: none !important;
            }
            table { color: black !important; }
            th, td { border: 1px solid #000000 !important; color: black !important; background: transparent !important; padding: 6px 4px !important; }
            th { background: #f1f5f9 !important; -webkit-print-color-adjust: exact; color: black !important; font-weight: bold !important; }
            .sticky-col { position: static !important; background: white !important; color: black !important; border-right: 1px solid #000000 !important; }
            
            /* Print overrides for status classes */
            .st-H { color: #059669 !important; } /* green-600 */
            .st-T { color: #ea580c !important; } /* orange-600 */
            .st-S { color: #ca8a04 !important; } /* yellow-600 */
            .st-I { color: #2563eb !important; } /* blue-600 */
            .st-A { color: #dc2626 !important; } /* red-600 */
            .leger-total-col { background: #f1f5f9 !important; color: black !important; }
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- LOGIN VIEW -->
    <div id="login-view" class="max-w-md mx-auto mt-20">
        <div class="glass-card rounded-3xl p-8 text-center shadow-2xl">
            <div class="w-20 h-20 bg-blue-500 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <h1 class="text-2xl font-bold mb-8">THHK Connect Admin</h1>
            <input type="password" id="admin-pass" placeholder="Password Admin" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 mb-6 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="loginAdmin()" class="w-full bg-blue-600 py-3 rounded-xl font-bold hover:bg-blue-500 transition">Masuk Ke Sistem</button>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="main-view" class="hidden max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4 no-print border-b border-white/5 pb-4">
            <div class="flex items-center justify-between w-full md:w-auto">
                <div>
                    <h1 class="text-3xl font-bold">Pusat Kendali Guru</h1>
                    <p class="text-blue-300 opacity-80 text-xs mt-0.5" id="current-date">Kamis, 7 Mei 2026</p>
                </div>
                <a href="index.html" class="flex md:hidden items-center gap-1 px-3 py-1.5 bg-blue-500/10 hover:bg-blue-500/20 border border-blue-500/30 rounded-xl text-xs font-bold text-blue-300 transition-all active:scale-95">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    <span>Kembali</span>
                </a>
            </div>
            <div class="flex items-center gap-3">
                <a href="index.html" class="hidden md:flex items-center gap-1 px-3 py-1.5 bg-blue-500/10 hover:bg-blue-500/20 border border-blue-500/30 rounded-xl text-xs font-bold text-blue-300 transition-all active:scale-95">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    <span>Kembali</span>
                </a>
                <div class="flex bg-white/5 p-1 rounded-xl border border-white/10 overflow-x-auto scrollbar-none whitespace-nowrap max-w-full flex-1 md:flex-initial">
                    <button onclick="setTab('daily')" id="tab-daily" class="tab-btn active px-4 py-2 rounded-lg font-bold transition text-xs flex-shrink-0">Absensi Harian</button>
                    <button onclick="setTab('recap')" id="tab-recap" class="tab-btn px-4 py-2 rounded-lg font-bold transition text-white/60 text-xs flex-shrink-0">Rekap & Leger</button>
                    <button onclick="setTab('analysis')" id="tab-analysis" class="tab-btn px-4 py-2 rounded-lg font-bold transition text-white/60 text-xs flex-shrink-0">Analisis Pola</button>
                </div>
            </div>
        </header>

        <!-- TAB 1: ABSENSI HARIAN -->
        <div id="content-daily" class="space-y-6">
            <div class="flex flex-col md:flex-row gap-4 no-print">
                <div class="flex-1">
                    <input type="text" id="search-student" oninput="renderDaily()" placeholder="Cari nama siswa..." class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4 focus:outline-none focus:ring-2 focus:ring-blue-500/50">
                </div>
                <select id="daily-kelas" onchange="loadDaily()" class="bg-white/10 border border-white/10 rounded-xl px-4 py-2">
                    <option value="8">Kelas 8</option>
                    <option value="9">Kelas 9</option>
                </select>
            </div>

            <div id="daily-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Data siswa harian -->
            </div>
        </div>

        <!-- TAB 2: REKAP & LEGER -->
        <div id="content-recap" class="hidden space-y-6">
            <div class="flex flex-wrap gap-2 no-print">
                <select id="recap-kelas" class="bg-white/10 border border-white/10 rounded-lg px-4 py-2">
                    <option value="8">Kelas 8</option>
                    <option value="9">Kelas 9</option>
                </select>
                <select id="recap-bulan" class="bg-white/10 border border-white/10 rounded-lg px-4 py-2">
                    <option value="0">Januari</option><option value="1">Februari</option><option value="2">Maret</option>
                    <option value="3">April</option><option value="4">Mei</option><option value="5">Juni</option>
                    <option value="6">Juli</option><option value="7">Agustus</option><option value="8">September</option>
                    <option value="9">Oktober</option><option value="10">November</option><option value="11">Desember</option>
                </select>
                <select id="recap-tahun" class="bg-white/10 border border-white/10 rounded-lg px-4 py-2">
                    <option value="2026">2026</option><option value="2025">2025</option>
                </select>
                <button onclick="loadRecap()" class="bg-blue-600 px-6 py-2 rounded-lg font-bold">Tampilkan</button>
                <button onclick="window.print()" class="bg-slate-700 px-6 py-2 rounded-lg font-bold">Cetak PDF</button>
            </div>

            <div id="print-header" class="hidden print:block text-center mb-6 text-black">
                <h2 class="text-2xl font-bold uppercase" id="print-title">LEGER ABSENSI</h2>
                <p id="print-subtitle" class="font-semibold"></p>
            </div>

            <!-- Swipe instruction for mobile -->
            <div class="block md:hidden text-center mb-3">
                <span class="inline-flex items-center gap-1.5 text-xs text-blue-300 font-bold bg-blue-500/10 px-3 py-1.5 rounded-full border border-blue-500/25 animate-pulse">
                    Swipe ke kanan/kiri untuk melihat leger lengkap ➡️
                </span>
            </div>

            <div class="leger-container shadow-2xl">
                <table id="leger-table">
                    <thead id="leger-head"></thead>
                    <tbody id="leger-body"></tbody>
                </table>
            </div>

            <div class="grid grid-cols-2 text-black text-xs text-center mt-10 hidden print:grid">
                <div>Mengetahui,<br>Kepala Sekolah<br><br><br><br><b>____________________</b></div>
                <div>Tegal, <span id="sign-date"></span><br>Wali Kelas<br><br><br><br><b>____________________</b></div>
            </div>
        </div>

        <!-- TAB 3: ANALISIS POLA (CERDAS) -->
        <div id="content-analysis" class="hidden space-y-6">
            <div class="flex justify-between items-center no-print">
                <h2 class="text-xl font-bold flex items-center gap-2">
                    <svg class="w-6 h-6 text-yellow-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd"></path></svg>
                    Sinyal Peringatan Siswa
                </h2>
                <select id="analysis-kelas" onchange="loadAnalysis()" class="bg-white/10 border border-white/10 rounded-lg px-4 py-2">
                    <option value="8">Kelas 8</option>
                    <option value="9">Kelas 9</option>
                </select>
            </div>
            
            <div id="analysis-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Kartu Peringatan akan muncul di sini -->
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://tknvnlyxipxjkospcpbt.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRrbnZubHl4aXB4amtvc3BjcGJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTYzOTksImV4cCI6MjA5NTY3MjM5OX0.lsZR2gsTFRqOwUqMMjBfMNP0zZFHTMPvTFC6BcXasG8';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let studentsData = [];
        let dailyLogs = [];

        async function loginAdmin() {
            const pass = document.getElementById('admin-pass').value;
            // Verifikasi sandi di server & terbitkan token sesi staf
            const { data: adminToken, error: errAdmin } = await supabaseClient.rpc('create_staff_session', {
                p_role: 'admin',
                p_password: pass
            });
            if (errAdmin) { alert('Gagal memverifikasi: ' + errAdmin.message); return; }
            if (adminToken) {
                localStorage.setItem('staff_token', adminToken);
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('main-view').classList.remove('hidden');
                document.getElementById('current-date').innerText = new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                loadDaily();
            } else { alert('Password Salah!'); }
        }

        function setTab(tab) {
            document.getElementById('content-daily').classList.toggle('hidden', tab !== 'daily');
            document.getElementById('content-recap').classList.toggle('hidden', tab !== 'recap');
            document.getElementById('content-analysis').classList.toggle('hidden', tab !== 'analysis');
            
            document.getElementById('tab-daily').classList.toggle('active', tab === 'daily');
            document.getElementById('tab-recap').classList.toggle('active', tab === 'recap');
            document.getElementById('tab-analysis').classList.toggle('active', tab === 'analysis');
            
            if (tab === 'daily') loadDaily();
            if (tab === 'analysis') loadAnalysis();
        }

        // --- HARIAN LOGIC ---
        async function loadDaily() {
            const kelas = document.getElementById('daily-kelas').value;
            const today = new Date().toISOString().split('T')[0];
            
            const { data: students } = await supabaseClient.from('students').select('id, nis, nama, kelas, device_id, created_at').eq('kelas', kelas).order('nama');
            const { data: logs } = await supabaseClient.from('attendance_logs').select('*').gte('created_at', today+'T00:00:00Z').lte('created_at', today+'T23:59:59Z');
            
            studentsData = students;
            dailyLogs = logs;
            renderDaily();

            // Realtime
            supabaseClient.channel('admin-realtime').on('postgres_changes', { event:'INSERT', schema:'public', table:'attendance_logs' }, payload => {
                if (new Date(payload.new.created_at).toDateString() === new Date().toDateString()) {
                    dailyLogs.push(payload.new);
                    renderDaily();
                }
            }).subscribe();
        }

        function renderDaily() {
            const container = document.getElementById('daily-list');
            const search = document.getElementById('search-student').value.toLowerCase();
            const filtered = studentsData.filter(s => s.nama.toLowerCase().includes(search));

            const styles = { 
                'H': 'bg-green-500/20 text-green-400 border-green-500/30', 
                'T': 'bg-orange-500/20 text-orange-400 border-orange-500/30', 
                'S': 'bg-yellow-500/20 text-yellow-450 border-yellow-500/30', 
                'I': 'bg-blue-500/20 text-blue-400 border-blue-500/30', 
                'A': 'bg-red-500/20 text-red-400 border-red-500/30' 
            };
            const names = { 'H': 'Hadir', 'T': 'Terlambat', 'S': 'Sakit', 'I': 'Izin', 'A': 'Alfa' };

            container.innerHTML = filtered.map(s => {
                const log = dailyLogs.find(l => l.user_id === s.id);
                // Cek jika siswa mengajukan izin melalui HP (fallback: status atau device_id mengandung [IZIN])
                let isIzin = false;
                let statusKode = log ? log.status : null;
                let keteranganIzin = '';

                if (log && log.device_id && log.device_id.startsWith('[IZIN]')) {
                    isIzin = true;
                    const match = log.device_id.match(/^\[IZIN\]\s*([^\s-]+)\s*(?:-\s*(.*))?$/i);
                    const jenis = match ? match[1] : '';
                    keteranganIzin = match ? match[2] || '' : '';
                    statusKode = (jenis === 'Sakit') ? 'S' : 'I';
                }

                // Jangan anggap string [IZIN] sebagai UUID device yang terkunci
                const isRealDevice = s.device_id && s.device_id !== '' && !s.device_id.startsWith('[IZIN]');

                return `
                    <div class="glass-card rounded-2xl p-4.5 flex flex-col justify-between gap-4">
                        <div class="flex justify-between items-start gap-2">
                            <div class="min-w-0 flex-1">
                                <h3 class="font-bold text-sm text-slate-100 break-words pr-2" title="${s.nama}">${s.nama}</h3>
                                <p class="text-[10px] opacity-60 mt-0.5">NIS: ${s.nis}</p>
                                ${isIzin && keteranganIzin ? `<p class="text-[10px] text-blue-300 mt-1.5 italic max-w-xs truncate" title="${keteranganIzin}">Ket: ${keteranganIzin}</p>` : ''}
                                ${(log && log.latitude && log.longitude) ? `<p class="text-[10px] text-yellow-350 mt-1.5"><a href="https://maps.google.com/?q=${log.latitude},${log.longitude}" target="_blank" class="hover:underline inline-flex items-center gap-1"><svg class="w-3.5 h-3.5 text-yellow-450" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg> Audit Lokasi GPS</a></p>` : ''}
                            </div>
                            ${isRealDevice ? `<button onclick="resetHP('${s.id}')" class="p-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 rounded-xl transition active:scale-95" title="Reset Device Siswa"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"></path></svg></button>` : ''}
                        </div>
                        <div class="w-full mt-1 border-t border-white/5 pt-3">
                            ${log ? `<span class="${styles[statusKode] || 'bg-white/10 text-white border-white/20'} border px-4 py-2 rounded-xl text-xs font-bold w-full block text-center">${names[statusKode] || statusKode}</span>` : `
                                <div class="grid grid-cols-4 gap-1.5">
                                    <button onclick="mark('${s.id}','H')" class="bg-green-600/15 hover:bg-green-600/25 border border-green-500/25 text-green-400 py-2 px-1 rounded-xl text-[11px] font-bold transition active:scale-95">Hadir</button>
                                    <button onclick="mark('${s.id}','S')" class="bg-yellow-600/15 hover:bg-yellow-600/25 border border-yellow-500/25 text-yellow-450 py-2 px-1 rounded-xl text-[11px] font-bold transition active:scale-95">Sakit</button>
                                    <button onclick="mark('${s.id}','I')" class="bg-blue-600/15 hover:bg-blue-600/25 border border-blue-500/25 text-blue-450 py-2 px-1 rounded-xl text-[11px] font-bold transition active:scale-95">Izin</button>
                                    <button onclick="mark('${s.id}','A')" class="bg-red-600/15 hover:bg-red-600/25 border border-red-500/25 text-red-400 py-2 px-1 rounded-xl text-[11px] font-bold transition active:scale-95">Alfa</button>
                                </div>
                            `}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function requireToken() {
            const t = localStorage.getItem('staff_token');
            if (!t) { alert('Sesi staf habis. Silakan login ulang.'); location.reload(); }
            return t;
        }

        async function mark(id, status) {
            const token = requireToken();
            if (!token) return;
            const { error } = await supabaseClient.rpc('proses_absen_piket', { p_student_id: id, p_teacher_note: 'ADMIN', p_status: status, p_token: token });
            if (error) { alert('Gagal mencatat absen: ' + error.message); return; }
            loadDaily();
        }

        async function resetHP(id) {
            if (!confirm('Reset kunci HP?')) return;
            const token = requireToken();
            if (!token) return;
            const { error } = await supabaseClient.rpc('reset_device_siswa', { p_student_id: id, p_token: token });
            if (error) { alert('Gagal reset HP: ' + error.message); return; }
            loadDaily();
        }

        // --- REKAP LOGIC ---
        async function loadRecap() {
            const kelas = document.getElementById('recap-kelas').value;
            const bulan = parseInt(document.getElementById('recap-bulan').value);
            const tahun = parseInt(document.getElementById('recap-tahun').value);
            const daysInMonth = new Date(tahun, bulan + 1, 0).getDate();

            document.getElementById('print-title').innerText = `LEGER ABSENSI KELAS ${kelas}`;
            document.getElementById('print-subtitle').innerText = `${document.getElementById('recap-bulan').options[bulan].text.toUpperCase()} ${tahun}`;
            document.getElementById('sign-date').innerText = new Date().toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'});

            const { data: students } = await supabaseClient.from('students').select('id, nis, nama, kelas, device_id, created_at').eq('kelas', kelas).order('nama');
            const start = new Date(tahun, bulan, 1).toISOString();
            const end = new Date(tahun, bulan + 1, 0, 23, 59, 59).toISOString();
            const { data: logs } = await supabaseClient.from('attendance_logs').select('*').gte('created_at', start).lte('created_at', end);

            const map = {};
            logs.forEach(l => { 
                const d = new Date(l.created_at).getDate();
                if(!map[l.user_id]) map[l.user_id] = {};
                
                let st = l.status;
                if (!st && l.device_id && l.device_id.startsWith('[IZIN]')) {
                    const match = l.device_id.match(/^\[IZIN\]\s*([^\s-]+)/i);
                    const jenis = match ? match[1] : '';
                    st = (jenis === 'Sakit') ? 'S' : 'I';
                }
                
                map[l.user_id][d] = st;
            });

            // Head
            let headHtml = `<tr><th class="sticky-col">Nama Siswa</th>`;
            for(let d=1; d<=daysInMonth; d++) headHtml += `<th>${d}</th>`;
            headHtml += `<th>Total H</th></tr>`;
            document.getElementById('leger-head').innerHTML = headHtml;

            // Body
            const colors = { 'H': 'st-H', 'T': 'st-T', 'S': 'st-S', 'I': 'st-I', 'A': 'st-A' };
            document.getElementById('leger-body').innerHTML = students.map(s => {
                let hTotal = 0;
                let cells = `<td class="sticky-col font-medium text-slate-100 print:text-black">${s.nama}</td>`;
                for(let d=1; d<=daysInMonth; d++) {
                    const st = map[s.id] && map[s.id][d];
                    cells += `<td class="font-bold ${colors[st]||''}">${st||'.'}</td>`;
                    if(st === 'H' || st === 'T') hTotal++;
                }
                return `<tr>${cells}<td class="leger-total-col font-bold">${hTotal}</td></tr>`;
            }).join('');
        }

        // --- ANALYSIS LOGIC (AI-STYLE) ---
        async function loadAnalysis() {
            const kelas = document.getElementById('analysis-kelas').value;
            const container = document.getElementById('analysis-grid');
            container.innerHTML = '<div class="col-span-full py-20 text-center opacity-50">Menganalisis pola ketidakhadiran...</div>';

            try {
                const { data: students } = await supabaseClient.from('students').select('id, nis, nama, kelas, device_id, created_at').eq('kelas', kelas);
                const { data: logs } = await supabaseClient.from('attendance_logs').select('*').gte('created_at', new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString());

                const map = {};
                logs.forEach(l => {
                    const d = new Date(l.created_at);
                    const dayName = d.toLocaleDateString('id-ID', { weekday: 'long' });
                    if(!map[l.user_id]) map[l.user_id] = { dates: [], statuses: [], days: [] };
                    
                    let st = l.status;
                    if (!st && l.device_id && l.device_id.startsWith('[IZIN]')) {
                        const match = l.device_id.match(/^\[IZIN\]\s*([^\s-]+)/i);
                        const jenis = match ? match[1] : '';
                        st = (jenis === 'Sakit') ? 'S' : 'I';
                    }

                    map[l.user_id].dates.push(d.getDate());
                    map[l.user_id].statuses.push(st);
                    map[l.user_id].days.push(dayName);
                });

                let alertHtml = '';
                students.forEach(s => {
                    const data = map[s.id] || { dates: [], statuses: [], days: [] };
                    const alfas = data.statuses.filter(st => st === 'A').length;
                    const totalAbsen = 30 - data.statuses.filter(st => st === 'H' || st === 'T').length; // Estimasi

                    // 1. Pola Frekuensi (> 3 Alfa)
                    if (alfas >= 3) {
                        alertHtml += createAlertCard(s.nama, '⚠️ Frekuensi Tinggi', `Siswa memiliki ${alfas} kali Alfa bulan ini. Perlu pemanggilan orang tua.`, 'border-red-500/50 text-red-400');
                    }

                    // 2. Pola Hari Tertentu (Misal: 2+ Senin absen)
                    const dayCounts = {};
                    data.days.forEach((day, idx) => {
                        if (data.statuses[idx] !== 'H' && data.statuses[idx] !== 'T') {
                            dayCounts[day] = (dayCounts[day] || 0) + 1;
                        }
                    });
                    for (let day in dayCounts) {
                        if (dayCounts[day] >= 2) {
                            alertHtml += createAlertCard(s.nama, '📅 Pola Hari Spesifik', `Siswa sering tidak hadir pada hari ${day}. Indikasi menghindari mapel tertentu.`, 'border-yellow-500/50 text-yellow-400');
                        }
                    }

                    // 3. Pola Berturut-turut (Sangat Penting)
                    // (Logika sederhana: jika selisih tanggal absen berurutan)
                    // ... (implementasi sederhana untuk demo)
                });

                container.innerHTML = alertHtml || '<div class="col-span-full py-20 text-center opacity-50">Tidak ditemukan pola mencurigakan bulan ini. Kerja bagus!</div>';

            } catch (err) { console.error(err); }
        }

        function createAlertCard(name, type, desc, style) {
            return `
                <div class="glass-card rounded-2xl p-6 border-l-4 ${style}">
                    <div class="flex justify-between items-start mb-4">
                        <span class="text-[10px] font-bold uppercase tracking-widest opacity-70">${type}</span>
                        <div class="w-2 h-2 rounded-full bg-current animate-pulse"></div>
                    </div>
                    <h3 class="font-bold text-lg mb-2">${name}</h3>
                    <p class="text-sm opacity-60 leading-relaxed">${desc}</p>
                    <button class="mt-6 w-full py-2 bg-white/5 rounded-xl text-xs font-bold hover:bg-white/10 transition">Tindak Lanjuti</button>
                </div>
            `;
        }
    </script>
