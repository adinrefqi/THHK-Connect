<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guru Dashboard - Buku Induk THHK</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e40af',
                        secondary: '#3b82f6',
                        dark: '#0f172a'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* === THEME SYSTEM === */
        :root {
            /* Light Mode (default - already light theme) */
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --nav-bg: #1e40af;
            --nav-text: #ffffff;
            --input-bg: #ffffff;
            --input-border: #d1d5db;
            --input-focus-border: #3b82f6;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --accent: #3b82f6;
            --card-bg: #1e293b;
            --card-border: #334155;
            --nav-bg: #1e3a8a;
            --nav-text: #ffffff;
            --input-bg: #1e293b;
            --input-border: #475569;
            --input-focus-border: #3b82f6;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- TOP NAVIGATION (Guru View) -->
    <nav class="text-white shadow-md z-20 relative" style="background-color: var(--nav-bg);">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <i class="fas fa-book-open text-2xl text-blue-300"></i>
                    <span class="font-bold text-lg tracking-tight" style="color: var(--nav-text);">Portal Guru - Buku Induk</span>
                </div>
                <div class="flex items-center gap-4">
                    <button id="theme-toggle" onclick="toggleTheme()" class="p-2 rounded-lg transition-all" style="background: rgba(255,255,255,0.1);" title="Ganti Tema">
                        <svg id="theme-icon-sun" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                        <svg id="theme-icon-moon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    </button>
                    <span id="user-name" class="font-medium text-sm hidden md:block" style="color: var(--nav-text);">Nama Guru</span>
                    <button onclick="logout()" class="p-2 rounded-lg transition" style="background: rgba(255,255,255,0.1);" title="Keluar">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col overflow-hidden">

        <!-- SEARCH BAR -->
        <div class="p-6 rounded-2xl shadow-sm border mb-6 shrink-0" style="background: var(--card-bg); border-color: var(--card-border);">
            <h2 class="text-xl font-bold mb-4" style="color: var(--text-primary);">Pencarian Data Siswa</h2>
            <div class="flex gap-4">
                <div class="relative flex-1">
                    <i class="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2" style="color: var(--text-muted);"></i>
                    <input type="text" id="guru-search" oninput="handleSearch()" placeholder="Masukkan NIS, NISN, atau Nama Siswa..." class="w-full pl-12 pr-4 py-3 border rounded-xl focus:outline-none transition" style="background: var(--input-bg); border-color: var(--input-border); color: var(--text-primary);">
                </div>
                <button onclick="handleSearch()" class="text-white px-8 py-3 rounded-xl font-bold shadow-md transition flex items-center gap-2" style="background: var(--accent);">
                    Cari Data
                </button>
            </div>
            <p class="text-xs mt-2" style="color: var(--text-muted);"><i class="fas fa-info-circle" style="color: var(--accent);"></i> Gunakan portal ini untuk melihat data demografi dan histori siswa secara cepat.</p>
        </div>

        <!-- SEARCH RESULTS (View Only) -->
        <div class="rounded-2xl shadow-sm border flex-1 overflow-hidden flex flex-col" style="background: var(--card-bg); border-color: var(--card-border);">
            <div class="p-4 border-b" style="background: var(--bg-secondary); border-color: var(--card-border);">
                <h3 class="font-bold" style="color: var(--text-secondary);">Hasil Pencarian (Menampilkan Semua)</h3>
            </div>
            <div class="flex-1 overflow-auto p-0">
                <table class="w-full text-left border-collapse">
                    <thead class="sticky top-0 z-10 shadow-sm border-b" style="background: var(--card-bg); border-color: var(--card-border);">
                        <tr>
                            <th class="py-3 px-6 text-xs font-bold uppercase" style="color: var(--text-muted);">Identitas</th>
                            <th class="py-3 px-6 text-xs font-bold uppercase" style="color: var(--text-muted);">Kontak Darurat</th>
                            <th class="py-3 px-6 text-xs font-bold uppercase" style="color: var(--text-muted);">Kelas</th>
                            <th class="py-3 px-6 text-xs font-bold uppercase text-center" style="color: var(--text-muted);">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="student-table-body" class="divide-y" style="border-color: var(--card-border);">
                        <tr><td colspan="4" class="py-10 text-center" style="color: var(--text-muted);">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        // Supabase Initialization
        const SUPABASE_URL = 'https://jbmhfwfckmneivztsizc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_lkdD9wXKswBi-r0PegxHhQ_6QTnitLL'; // Must match index.html
        var supabaseClient = null;
        if (window.supabase) {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        let allData = []; // Store data locally

        function checkAuth() {
            const session = localStorage.getItem('bi_session');
            if (!session) {
                window.location.href = 'index.html';
                return;
            }
            try {
                const data = JSON.parse(session);
                document.getElementById('user-name').innerText = data.nama;
                fetchData(); // Fetch data if auth passes
            } catch (e) {
                window.location.href = 'index.html';
            }
        }
        checkAuth();

        // Fetch Data from Supabase
        async function fetchData() {
            if(!supabaseClient) return;
            try {
                const { data, error } = await supabaseClient
                    .from('buku_induk')
                    .select('*')
                    .order('nama_lengkap', { ascending: true });

                if (error) throw error;
                allData = data || [];
                renderTable(allData);
            } catch (err) {
                console.error('Fetch error:', err);
                document.getElementById('student-table-body').innerHTML = '<tr><td colspan="4" class="py-10 text-center" style="color: #ef4444;">Gagal memuat data.</td></tr>';
            }
        }

        function renderTable(dataToRender) {
            const tbody = document.getElementById('student-table-body');
            if (dataToRender.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="py-10 text-center" style="color: var(--text-muted);">Tidak ada data siswa ditemukan.</td></tr>';
                return;
            }

            let html = '';
            dataToRender.forEach(student => {
                // Determine best contact
                let contactName = student.nama_ayah || student.nama_ibu || student.nama_wali || '-';
                let contactPhone = student.no_telp_ortu || student.no_telp_siswa || '-';

                html += `
                    <tr class="transition" style="border-color: var(--card-border);">
                        <td class="py-4 px-6">
                            <p class="font-bold" style="color: var(--text-primary);">${student.nama_lengkap}</p>
                            <p class="text-xs" style="color: var(--text-muted);">NIS: ${student.nis || '-'} • ${student.jenis_kelamin || '-'}</p>
                        </td>
                        <td class="py-4 px-6">
                            <p class="text-sm" style="color: var(--text-primary);">${contactName}</p>
                            <p class="text-xs" style="color: var(--text-muted);"><i class="fas fa-phone-alt"></i> ${contactPhone}</p>
                        </td>
                        <td class="py-4 px-6 font-medium" style="color: var(--text-secondary);">${student.kelas_sekarang || '-'}</td>
                        <td class="py-4 px-6 text-center space-x-1">
                            <button onclick="alert('Profil Detail Segera Hadir')" class="px-3 py-1.5 rounded-lg text-sm font-semibold transition" style="background: var(--accent); color: white;" title="Buka Detail Profil">
                                <i class="fas fa-folder-open"></i> Buka
                            </button>
                            <button onclick="window.open('print_induk.html?id=${student.id}', '_blank')" class="px-3 py-1.5 rounded-lg text-sm font-semibold transition" style="background: #10b981; color: white;" title="Cetak Lembar Induk">
                                <i class="fas fa-print"></i> Cetak
                            </button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        function handleSearch() {
            const query = document.getElementById('guru-search').value.toLowerCase();
            if(!query) {
                renderTable(allData);
                return;
            }
            const filtered = allData.filter(s => 
                (s.nis && s.nis.toLowerCase().includes(query)) || 
                (s.nama_lengkap && s.nama_lengkap.toLowerCase().includes(query)) ||
                (s.nisn && s.nisn.toLowerCase().includes(query)) ||
                (s.kelas_sekarang && s.kelas_sekarang.toLowerCase().includes(query))
            );
            renderTable(filtered);
        }

        function logout() {
            localStorage.removeItem('bi_session');
            window.location.href = 'index.html';
        }

        // ========== THEME TOGGLE ==========
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const newTheme = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            const sunIcon = document.getElementById('theme-icon-sun');
            const moonIcon = document.getElementById('theme-icon-moon');
            if (sunIcon && moonIcon) {
                if (theme === 'dark') {
                    sunIcon.classList.add('hidden');
                    moonIcon.classList.remove('hidden');
                } else {
                    sunIcon.classList.remove('hidden');
                    moonIcon.classList.add('hidden');
                }
            }
        }

        // Initialize theme on page load
        document.addEventListener('DOMContentLoaded', initTheme);
    </script>
</body>
</html>
